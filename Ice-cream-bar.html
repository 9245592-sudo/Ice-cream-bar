<!DOCTYPE html>
<!-- This code was provided as starter code by my teacher. -->
<html>
  
<head>
   <!--The head section contains general information about the webpage.-->
   <title>     </title>
   <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"> </script>
   <style>
       /*The style section controls how pieces of your webpage look.*/
   </style>
</head>


<body>
   <!--The body section contains the content of your webpage.-->
   <header>
       <h2>    </h2>
   </header>
   <div x-data="webApp">
   <label>
  <input type="radio" name="container" container[0] x-model="radioChoice"> Cone
  </label>
    <label>
  <input type="radio" name="container" container[1] x-model="radioChoice"> Tub
  </label>
    <label>
  <input type="radio" name="container" container[2] x-model="radioChoice"> Cup
  </label>
    <label>
  <input type="radio" name="container" container[3] x-model="radioChoice"> Waffle Cone
  </label>
   <label>
  <input type="radio" name="container" container[4] x-model="radioChoice">  Banana Split
  </label>

    
   </div>
  
   <footer>
       <p>© 2026-2027<br>
       AP Computer Science Principles<br>
       George Washington High School</p>
   </footer>
  
   <script>
       //The script section contains the JavaScript logic
       document.addEventListener('alpine:init', () => {
           Alpine.data('webApp', () => ({
            container: ["Cone", "Tub", "Cup", "Waffle Cone", "Banana Split"]   






           }));
       });
   </script>
</body>
</html>
